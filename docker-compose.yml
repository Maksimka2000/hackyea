# The whole HubMI.pl stack with one command, from the repository root:
#
#   docker compose up --build
#
#   web  http://localhost:3000        api  http://localhost:8081 (Swagger: /swagger)        postgres  127.0.0.1:5433
#
# The first build downloads the matching models (about 1.1 GB) and the first start embeds the library in the background;
# searches use keyword search until that finishes. The API container needs 2-3 GB of RAM.
# The defaults below are for local development only: copy .env.example to .env and set real secrets before any shared deployment.
name: hubmi

services:
  postgres:
    image: postgres:16
    container_name: hubmi-postgres
    environment:
      POSTGRES_DB: hubmi
      POSTGRES_USER: hubmi
      POSTGRES_PASSWORD: ${HUBMI_DB_PASSWORD:-hubmi-dev-password}
    volumes:
      - hubmi-pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hubmi -d hubmi"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./server
      dockerfile: HubMi.Api/Dockerfile
    container_name: hubmi-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ConnectionStrings__HubMi: Host=postgres;Port=5432;Database=hubmi;Username=hubmi;Password=${HUBMI_DB_PASSWORD:-hubmi-dev-password}
      Swagger__Enabled: ${HUBMI_SWAGGER_ENABLED:-true}
      # Trust X-Forwarded-For from the web container (the /api proxy) on private networks only; narrow these in production.
      ForwardedHeaders__KnownNetworks__0: 10.0.0.0/8
      ForwardedHeaders__KnownNetworks__1: 172.16.0.0/12
      ForwardedHeaders__KnownNetworks__2: 192.168.0.0/16
      Persistence__MigrateOnStartup: "true"
      Persistence__SeedSampleLibrary: "true"
      Persistence__SeedIdentity: ${HUBMI_SEED_DEMO_ACCOUNTS:-true}
      Auth__ExposeDemoAccounts: ${HUBMI_SEED_DEMO_ACCOUNTS:-true}
      # Development default only (32+ characters). Set HUBMI_JWT_SECRET in .env for anything shared.
      Auth__Jwt__SecretKey: ${HUBMI_JWT_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      Matching__ClientKeySalt: ${HUBMI_CLIENT_KEY_SALT:-}
      RateLimiting__Match__PermitLimit: ${HUBMI_MATCH_RATE_LIMIT:-20}
    ports:
      - "8081:8080"
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        # The web server reaches the API over the compose network; the browser only ever talks to the web server (/api is proxied).
        API_ORIGIN: http://api:8080
    container_name: hubmi-web
    depends_on:
      - api
    environment:
      API_ORIGIN: http://api:8080
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  hubmi-pgdata:
